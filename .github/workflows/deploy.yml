name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: faro-497316
  REGION: southamerica-east1
  SERVICE: faro-app
  IMAGE: gcr.io/faro-497316/faro-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Docker image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 10 \
            --cpu-boost \
            --execution-environment gen2 \
            --set-env-vars="NODE_ENV=production,AUTH_URL=https://faro-app-han7ftrrca-rj.a.run.app,AUTH_TRUST_HOST=true" \
            --set-secrets="NEXT_PUBLIC_SUPABASE_URL=FARO_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=FARO_SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=FARO_SUPABASE_SERVICE_ROLE:latest,AUTH_SECRET=FARO_AUTH_SECRET:latest,AUTH_GOOGLE_ID=FARO_GOOGLE_CLIENT_ID:latest,AUTH_GOOGLE_SECRET=FARO_GOOGLE_CLIENT_SECRET:latest,GOOGLE_GEMINI_API_KEY=FARO_GEMINI_API_KEY:latest"
