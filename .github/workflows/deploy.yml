name: Deploy to Cloud Run

# MANUAL ONLY. This workflow used to run on every push to main and passed
# --set-env-vars / --set-secrets, which REPLACE the service's whole configuration
# (it omitted CRON_SECRET and pointed AUTH_URL at a different host). Releases are
# made with `gcloud builds submit` + `gcloud run deploy --image` (which keeps the
# service's existing env and secrets). Re-enable the push trigger only after moving
# to Workload Identity Federation (no long-lived key) and adding a staging project.

on:
  workflow_dispatch:

env:
  PROJECT_ID: faro-497316
  REGION: southamerica-east1
  SERVICE: faro-app
  IMAGE: gcr.io/faro-497316/faro-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Docker image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        # No --set-env-vars / --set-secrets on purpose: keep the service's existing configuration.
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 10 \
            --cpu-boost \
            --execution-environment gen2
